name: Publish to npm

# NOTE: do not add `release: published` here. Creating a release with a new
# tag (or on top of a pushed tag) also fires the tag push event, so the
# workflow used to run twice in parallel — the loser hit a 409 "already
# published" mid-race. Tag push alone covers every release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:production

      # Re-dispatches (or a re-push of an existing tag) must not fail with a
      # 409 "cannot publish over previously published version" — skip the
      # publish step when the version is already on npm.
      - name: Check if version is already on npm
        id: npm-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "comics-now@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "comics-now@${VERSION} is already published — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
